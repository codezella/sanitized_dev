      - peBtnSave:
          Control: ModernButton@1.0.0
          Properties:
            BasePaletteColor: =Navy
            Color: =Color.White
            DisplayMode: =If((varCanWrite || (varCanWriteET && varSelected.Level.Value in ["Epic", "Task"])), DisplayMode.Edit, DisplayMode.Disabled)
            Height: =48
            OnSelect: |-
              =Set(varErrors,
                  Filter(Table(
                      { Field: "A comment is required when setting """ & peStatus.Selected.Value & """",
                        Bad: peStatus.Selected.Value <> varOldStatus
                             && peStatus.Selected.Value in ["At Risk","Delayed","Blocked","Paused","Cancelled"]
                             && IsBlank(peComment.Text) },
                      { Field: "Start Date", Bad: IsBlank(peStart.SelectedDate) },
                      { Field: "Due Date",   Bad: IsBlank(peDue.SelectedDate) },
                      { Field: "End Date is required when Status is Complete or Cancelled",
                        Bad: peStatus.Selected.Value in ["Complete","Cancelled"] && IsBlank(peEnd.SelectedDate) },
                      { Field: "End Date must be on or after Start Date",
                        Bad: peStatus.Selected.Value in ["Complete","Cancelled"] && !IsBlank(peStart.SelectedDate)
                             && !IsBlank(peEnd.SelectedDate) && peEnd.SelectedDate < peStart.SelectedDate },
                      { Field: "A comment is required when changing the Due Date after work has started",
                        Bad: !IsBlank(varSelected.Start) && varSelected.Start < Today()
                             && peDue.SelectedDate <> varSelected.Due && IsBlank(peComment.Text) },
                      { Field: "Description",
                        Bad: IsBlank(peDesc.Text) },
                      { Field: "Assigned To", Bad: IsBlank(peAssigned.Selected.Mail) },
                      { Field: "Due Date must be on or after Start Date",
                        Bad: !IsBlank(peStart.SelectedDate) && !IsBlank(peDue.SelectedDate)
                             && peDue.SelectedDate < peStart.SelectedDate }
                  ), Bad));
              If(CountRows(varErrors) = 0,
                  Patch('BOB Integrated Master Schedule (IMS)', varSelected,
                      { Status: { Value: peStatus.Selected.Value },
                        Description: peDesc.Text,
                        Appraisal: { Value: peAppraisal.Selected.Value },
                        Assigned: If(IsBlank(peAssigned.Selected.Mail), Blank(),
                          { Claims: "i:0#.f|membership|" & Lower(peAssigned.Selected.Mail),
                          DisplayName: peAssigned.Selected.DisplayName,
                          Email: peAssigned.Selected.Mail,
                          Department: "", JobTitle: "", Picture: "" }),
                        Collaborators: ForAll(peCollab.SelectedItems As u,
                          { Claims: "i:0#.f|membership|" & Lower(u.Mail),
                          DisplayName: u.DisplayName,
                          Email: u.Mail,
                          Department: "", JobTitle: "", Picture: "" }),
                        Start: peStart.SelectedDate,
                        Due: peDue.SelectedDate,
                        End: If(peStatus.Selected.Value in ["Complete","Cancelled"], peEnd.SelectedDate, Blank()),
                        'Last Status Date': If(peStatus.Selected.Value <> varOldStatus,
                                               Today(), varSelected.'Last Status Date') });
                  If(!IsBlank(peComment.Text),
                      Patch('BOB Integrated Master Schedule (IMS) Comments',
                          Defaults('BOB Integrated Master Schedule (IMS) Comments'),
                          { 'Work Item': { Id: varSelected.ID, Value: varSelected.'Task Name' },
                            Comment: peComment.Text,
                            'Status Change': If(peStatus.Selected.Value <> varOldStatus,
                                                varOldStatus & " → " & peStatus.Selected.Value, "") }));
                  UpdateIf(colItems, ID = varSelected.ID, { StatusText: peStatus.Selected.Value });
                  UpdateIf(colRows, ItemId = varSelected.ID,
                      { StatusText: peStatus.Selected.Value, RowStart: peStart.SelectedDate,
                        RowDue: peDue.SelectedDate,
                        AppraisalText: peAppraisal.Selected.Value,
                        AssignedName: peAssigned.Selected.DisplayName,
                        AssignedMail: peAssigned.Selected.Mail,
                        CollabMails: Concat(peCollab.SelectedItems, Mail, ";") });
                  Set(varSelected,
                      LookUp('BOB Integrated Master Schedule (IMS)', ID = varSelected.ID));
                  Reset(peComment);
                  Reset(peDesc);
                  Notify(If(peStatus.Selected.Value <> varOldStatus,
                            "Saved — " & varOldStatus & " → " & peStatus.Selected.Value &
                            " · Last Updated stamped", "Saved"),
                         NotificationType.Success, 2600);
                  Set(varPanelMode, "read"))
            Size: =14
            Text: ="Save"
            Visible: =varPanelMode = "edit"
            Width: =Parent.Width / 2 - 52
            X: =Parent.Width / 2 + 26
            Y: =Parent.Height - 118
      - peBtnCancel:
          Control: ModernButton@1.0.0
          Properties:
            Appearance: =ButtonAppearance.Outline
            BasePaletteColor: =Navy
            Color: =Navy
            Height: =44
            OnSelect: =Set(varErrors, Blank()); Set(varPanelMode, "read"); Reset(peDesc)
            Size: =13
            Text: ="Cancel"
            Visible: =varPanelMode = "edit"
            Width: =Parent.Width / 2 - 52
            X: =Parent.Width / 2 + 26
            Y: =Parent.Height - 62
      - pnBtnCreate:
          Control: ModernButton@1.0.0
          Properties:
            BasePaletteColor: =Navy
            Color: =Color.White
            DisplayMode: |-
              =If(!varCanWrite || !varCanWriteET || !(pnLevel.Selected.Value in ["Line of Effort", "Epic", "Task"]),
                  DisplayMode.Disabled, DisplayMode.Edit)
            Height: =48
            OnSelect: |-
              =Set(varErrors,
                  Filter(Table(
                      { Field: "Level",
                        Bad: !(pnLevel.Selected.Value in ["Line of Effort", "Epic", "Task"]) },
                      { Field: "Parent",
                        Bad: If(pnLevel.Selected.Value = "Line of Effort",
                                IsBlank(pnSection.Selected.Label),
                                IsBlank(pnParent.Selected.ID)) },
                      { Field: "Title",       Bad: IsBlank(pnTitle.Text) },
                      { Field: "Title — a " & pnLevel.Selected.Value &
                               " name """ & Trim(pnTitle.Text) & """ already exists",
                               Bad: !IsBlank(pnTitle.Text)
                               && CountRows(Filter(colItems,
                                  LevelText = pnLevel.Selected.Value
                                  && Lower(Trim('Task Name')) = Lower(Trim(pnTitle.Text)))) > 0 },
                      { Field: "Description", Bad: IsBlank(pnDesc.Text) },
                      { Field: "Assigned",    Bad: IsBlank(pnAssigned.Selected.Mail) },
                      { Field: "Start Date",  Bad: IsBlank(pnStart.SelectedDate) },
                      { Field: "Due Date",    Bad: IsBlank(pnDue.SelectedDate) },
                      { Field: "Due Date must be on or after Start Date",
                        Bad: !IsBlank(pnStart.SelectedDate) && !IsBlank(pnDue.SelectedDate)
                             && pnDue.SelectedDate < pnStart.SelectedDate }
                  ), Bad));
              If(CountRows(varErrors) = 0,
                  Set(varNewItem,
                      Patch('BOB Integrated Master Schedule (IMS)',
                          Defaults('BOB Integrated Master Schedule (IMS)'),
                          { 'Task Name': pnTitle.Text,
                            Description: pnDesc.Text,
                            Level: { Value: pnLevel.Selected.Value },
                            'Parent': If(pnLevel.Selected.Value = "Line of Effort",
                                       Blank(),
                                       { Id: pnParent.Selected.ID, Value: pnParent.Selected.'Task Name' }),
                            'Line of Effort': varChain.LOE,
                            Epic: varChain.Epic,
                            Section: If(pnLevel.Selected.Value = "Line of Effort",
                                        LookUp(Choices([@'BOB Integrated Master Schedule (IMS)'].Section,
                                          pnSection.Selected.Label),
                                          Label = pnSection.Selected.Label), 
                                        pnParent.Selected.Section),
                            Assigned: { Claims: "i:0#.f|membership|" & Lower(pnAssigned.Selected.Mail),
                                      DisplayName: pnAssigned.Selected.DisplayName,
                                      Email: pnAssigned.Selected.Mail,
                                      Department: "", JobTitle: "", Picture: "" },
                            Collaborators: ForAll(pnCollab.SelectedItems As u,
                                      { Claims: "i:0#.f|membership|" & Lower(u.Mail),
                                      DisplayName: u.DisplayName,
                                      Email: u.Mail,
                                      Department: "", JobTitle: "", Picture: "" }),
                            Status: { Value: pnStatus.Selected.Value },
                            Start: pnStart.SelectedDate,
                            Due: pnDue.SelectedDate,
                            End: If(pnStatus.Selected.Value in ["Complete","Cancelled"], Today(), Blank()) }));
                  If(!IsBlank(varChain.Section) && !("S|" & varChain.Section in Filter(colExpanded, Tab = varTab).Key),
                      Collect(colExpanded, { Tab: varTab, Key: "S|" & varChain.Section }));
                  If(!IsBlank(varChain.LOE)
                         && !("L|" & varChain.Section & "|" & varChain.LOE in Filter(colExpanded, Tab = varTab).Key),
                      Collect(colExpanded, { Tab: varTab, Key: "L|" & varChain.Section & "|" & varChain.LOE }));
                  Select(icoRefresh);
                  Notify("Created """ & pnTitle.Text & """ under " &
                         Coalesce(varChain.Epic, varChain.LOE, varChain.Section, "—"),
                         NotificationType.Success, 2600);
                  Set(varSelected, varNewItem);
                  Set(varPanelMode, If(pnLevel.Selected.Value = "Line of Effort", "", "read")))
            Size: =14
            Text: ="Create"
            Visible: =varPanelMode = "new"
            Width: =Parent.Width / 2 - 52
            X: =Parent.Width / 2 + 26
            Y: =Parent.Height - 90
