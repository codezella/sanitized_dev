Screens:
  scrMain:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
    Children:
      - galMain:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            Height: =Parent.Height - 288
            Items: |-
              =With({ q: Lower(txtSearch.Text),
                      fs: ddStatusFilter.Selected.Value,
                      fa: ddApprFilter.Selected.Value },
                  SortByColumns(
                      Filter(colRows As r,
                          Switch(r.Lvl,
                              1, CountRows(Filter(colRows,
                                     Lvl >= 2 && SectionKey = r.RowKey
                                     && (IsBlank(q) || q in Lower(RowTitle))
                                     && (IsBlank(fs) || fs = "All Statuses" || StatusText = fs)
                                     && (IsBlank(fa) || fa = "All Appraisals" || AppraisalText = fa)
                                     && (varTab <> "mine" || Lower(AssignedMail) = MyMail
                                         || MyMail in CollabMails)
                                     && (varTab <> "roadmap" || Roadmap))) > 0
                                 || ((varTab = "all") && IsBlank(q)
                                     && (IsBlank(fs) || fs = "All Statuses")
                                     && (IsBlank(fa) || fa = "All Appraisals")
                                     && CountRows(Filter(colRows,
                                            Lvl >= 3 && SectionKey = r.RowKey)) = 0),
                              2, (r.SectionKey in Filter(colExpanded, Tab = varTab).Key)
                                 && (CountRows(Filter(colRows,
                                     Lvl >= 2 && LOEKey = r.RowKey
                                     && (IsBlank(q) || q in Lower(RowTitle))
                                     && (IsBlank(fs) || fs = "All Statuses" || StatusText = fs)
                                     && (IsBlank(fa) || fa = "All Appraisals" || AppraisalText = fa)
                                     && (varTab <> "mine" || Lower(AssignedMail) = MyMail
                                         || MyMail in CollabMails)
                                     && (varTab <> "roadmap" || Roadmap))) > 0
                                 || ((varTab = "all") && IsBlank(q)
                                     && (IsBlank(fs) || fs = "All Statuses")
                                     && (IsBlank(fa) || fa = "All Appraisals")
                                     && CountRows(Filter(colRows,
                                            Lvl >= 3 && LOEKey = r.RowKey)) = 0)),
                              (r.SectionKey in Filter(colExpanded, Tab = varTab).Key)
                              && (r.LOEKey in Filter(colExpanded, Tab = varTab).Key)
                              && (IsBlank(q) || q in Lower(r.RowTitle))
                              && (IsBlank(fs) || fs = "All Statuses" || r.StatusText = fs)
                              && (IsBlank(fa) || fa = "All Appraisals" || r.AppraisalText = fa)
                              && (varTab <> "mine" || Lower(r.AssignedMail) = MyMail
                                  || MyMail in r.CollabMails)
                              && (varTab <> "roadmap" || r.Roadmap))),
                      "SortPath", SortOrder.Ascending))
            TemplatePadding: =3
            TemplateSize: =56
            Visible: =varTab <> "analytics"
            Width: =Parent.Width
            Y: =288
          Children:
            - recRowBand:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =Switch(ThisItem.Lvl, 1, SecTint, 2, LoeTint, RowFill)
                  Height: =56
                  OnSelect: |-
                    =If(ThisItem.Lvl = 1,
                        If(ThisItem.RowKey in Filter(colExpanded, Tab = varTab).Key,
                            Remove(colExpanded, LookUp(colExpanded, Tab = varTab && Key = ThisItem.RowKey)),
                            Collect(colExpanded, { Tab: varTab, Key: ThisItem.RowKey })),
                        Set(varSelected,
                            LookUp('BOB Integrated Master Schedule (IMS)', ID = ThisItem.ItemId));
                        Set(varPanelMode, "read"))
                  Width: =Parent.TemplateWidth
            - recBandTop:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =If(ThisItem.Lvl = 1, SecEdge, LoeEdge)
                  Height: =2
                  Visible: =ThisItem.Lvl <= 2
                  Width: =Parent.TemplateWidth
            - recBandBottom:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =If(ThisItem.Lvl = 1, SecEdge, LoeEdge)
                  Height: =2
                  Visible: =ThisItem.Lvl <= 2
                  Width: =Parent.TemplateWidth
                  Y: =54
            - icoToggle:
                Control: ModernButton@1.0.0
                Properties:
                  AccessibleLabel: ="Expand or collapse group"
                  Appearance: =ButtonAppearance.Transparent
                  Color: =ColorValue("#444444")
                  Icon: =If(ThisItem.RowKey in Filter(colExpanded, Tab = varTab).Key, "ChevronDown", "ChevronRight")
                  Layout: =ButtonLayout.IconOnly
                  OnSelect: |-
                    =If(ThisItem.RowKey in Filter(colExpanded, Tab = varTab).Key,
                        Remove(colExpanded, LookUp(colExpanded, Tab = varTab && Key = ThisItem.RowKey)),
                        Collect(colExpanded, { Tab: varTab, Key: ThisItem.RowKey }))
                  Visible: =ThisItem.Lvl <= 2
                  Width: =32
                  X: =If(ThisItem.Lvl = 1, 10, 34)
                  Y: =12
            - lblRowChip:
                Control: ModernText@1.0.0
                Properties:
                  Color: =LookUp(LevelColors, Lvl = ThisItem.Lvl, Fill)
                  FontWeight: =FontWeight.Bold
                  Height: =56
                  OnSelect: |-
                    =Set(varSelected,
                         LookUp('BOB Integrated Master Schedule (IMS)', ID = ThisItem.ItemId));
                    Set(varPanelMode, "read")
                  Size: =12
                  Text: =If(ThisItem.Lvl = 3, "EPIC", "TASK")
                  Visible: =ThisItem.Lvl >= 3
                  Width: =56
                  X: =If(ThisItem.Lvl = 3, 80, 112)
            - lblRowTitle:
                Control: ModernText@1.0.0
                Properties:
                  Color: =InkOnLight
                  FontWeight: =If(ThisItem.Lvl <= 2, FontWeight.Bold, FontWeight.Normal)
                  Height: =56
                  OnSelect: |-
                    =If(ThisItem.Lvl = 1,
                        If(ThisItem.RowKey in Filter(colExpanded, Tab = varTab).Key,
                            Remove(colExpanded, LookUp(colExpanded, Tab = varTab && Key = ThisItem.RowKey)),
                            Collect(colExpanded, { Tab: varTab, Key: ThisItem.RowKey })),
                        Set(varSelected,
                            LookUp('BOB Integrated Master Schedule (IMS)', ID = ThisItem.ItemId));
                        Set(varPanelMode, "read"))
                  Size: =13
                  Text: |-
                    =If(ThisItem.Lvl <= 2,
                        ThisItem.RowTitle & "     " &
                        CountRows(Filter(colRows,
                            Lvl >= 2 && RowKey <> ThisItem.RowKey
                            && (SectionKey = ThisItem.RowKey || LOEKey = ThisItem.RowKey)
                            && (IsBlank(txtSearch.Text) || Lower(txtSearch.Text) in Lower(RowTitle))
                            && (IsBlank(ddStatusFilter.Selected.Value)
                                || ddStatusFilter.Selected.Value = "All Statuses"
                                || StatusText = ddStatusFilter.Selected.Value)
                            && (IsBlank(ddApprFilter.Selected.Value)
                                || ddApprFilter.Selected.Value = "All Appraisals"
                                || AppraisalText = ddApprFilter.Selected.Value)
                            && (varTab <> "mine" || Lower(AssignedMail) = MyMail || MyMail in CollabMails)
                            && (varTab <> "roadmap" || Roadmap))) & " items",
                        ThisItem.RowTitle)
                  Width: =(Parent.TemplateWidth * 0.30) - Switch(ThisItem.Lvl, 1, 48, 2, 72, 3, 140, 172) + 40
                  X: =Switch(ThisItem.Lvl, 1, 48, 2, 72, 3, 140, 172)
            - lblRowStatus:
                Control: ModernText@1.0.0
                Properties:
                  Color: =LookUp(StatusTable, Status = ThisItem.StatusText, Color)
                  FontWeight: =FontWeight.Semibold
                  Height: =56
                  OnSelect: |-
                    =Set(varSelected,
                         LookUp('BOB Integrated Master Schedule (IMS)', ID = ThisItem.ItemId));
                    Set(varPanelMode, "read")
                  Size: =13
                  Text: =ThisItem.StatusText
                  Visible: =ThisItem.Lvl >= 3
                  Width: =Parent.TemplateWidth * 0.11
                  X: =Parent.TemplateWidth * 0.34
            - lblRowLevel:
                Control: ModernText@1.0.0
                Properties:
                  Color: =LookUp(LevelColors, Lvl = ThisItem.Lvl, Fill)
                  FontWeight: =FontWeight.Bold
                  Height: =56
                  OnSelect: |-
                    =Set(varSelected,
                         LookUp('BOB Integrated Master Schedule (IMS)', ID = ThisItem.ItemId));
                    Set(varPanelMode, "read")
                  Size: =12
                  Text: =If(ThisItem.Lvl = 3, "EPIC", "TASK")
                  Visible: =ThisItem.Lvl >= 3
                  Width: =Parent.TemplateWidth * 0.09
                  X: =Parent.TemplateWidth * 0.46
            - lblRowAssigned:
                Control: ModernText@1.0.0
                Properties:
                  Color: =InkOnLight
                  Height: =56
                  OnSelect: |-
                    =Set(varSelected,
                         LookUp('BOB Integrated Master Schedule (IMS)', ID = ThisItem.ItemId));
                    Set(varPanelMode, "read")
                  Size: =13
                  Text: |-
                    =ThisItem.AssignedName &
                    If(Lower(ThisItem.AssignedMail) = MyMail, " (you)", "")
                  Visible: =ThisItem.Lvl >= 3
                  Width: =Parent.TemplateWidth * 0.15
                  X: =Parent.TemplateWidth * 0.56
            - lblRowStart:
                Control: ModernText@1.0.0
                Properties:
                  Color: |-
                    =If(!IsBlank(ThisItem.RowStart) && ThisItem.RowStart > Today(),
                        LookUp(StatusTable, Status = ThisItem.StatusText, Color),
                        InkOnLight)
                  FontWeight: |-
                    =If(!IsBlank(ThisItem.RowStart) && ThisItem.RowStart > Today(),
                        FontWeight.Bold, FontWeight.Normal)
                  Height: =56
                  OnSelect: |-
                    =Set(varSelected,
                         LookUp('BOB Integrated Master Schedule (IMS)', ID = ThisItem.ItemId));
                    Set(varPanelMode, "read")
                  Size: =13
                  Text: =If(!IsBlank(ThisItem.RowStart), Text(ThisItem.RowStart, "mm/dd/yyyy"), "-")
                  Visible: =ThisItem.Lvl >= 3
                  Width: =Parent.TemplateWidth * 0.12
                  X: =Parent.TemplateWidth * 0.72
            - lblRowDue:
                Control: ModernText@1.0.0
                Properties:
                  Color: =InkOnLight
                  Height: =56
                  OnSelect: |-
                    =Set(varSelected,
                         LookUp('BOB Integrated Master Schedule (IMS)', ID = ThisItem.ItemId));
                    Set(varPanelMode, "read")
                  Size: =13
                  Text: =If(!IsBlank(ThisItem.RowDue), Text(ThisItem.RowDue, "mm/dd/yyyy"), "-")
                  Visible: =ThisItem.Lvl >= 3
                  Width: =Parent.TemplateWidth * 0.12
                  X: =Parent.TemplateWidth * 0.85
      - recLogo:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =Navy
            Height: =96
            Width: =240
      - imgSeal:
          Control: Image@2.2.3
          Properties:
            Height: =72
            Image: =cisa_logo_lg
            Width: =200
            X: =18
            Y: =12
      - recMasthead:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =Navy
            Height: =96
            Width: =Parent.Width - 240
            X: =240
      - recHeadDivider:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(255, 255, 255, 0.55)
            Height: =recLogo.Height
            Width: =2
            X: =240
      - lblMasthead:
          Control: ModernText@1.0.0
          Properties:
            Color: =Color.White
            FontWeight: =FontWeight.Semibold
            Height: =96
            Size: =26
            Text: ="BOB - Integrated Master Schedule"
            Width: =800
            X: =280
      - lblTabAll:
          Control: ModernText@1.0.0
          Properties:
            Color: =Navy
            FontWeight: =FontWeight.Semibold
            Height: =52
            OnSelect: =Set(varTab, "all")
            Size: =If(Parent.Width < 1200, 16, 20)
            Text: ="All Work"
            Width: =If(Parent.Width < 1200, 92, 116)
            X: =40
            Y: =108
      - lblCountAll:
          Control: ModernButton@1.0.0
          Properties:
            BasePaletteColor: =If(varTab = "all", Navy, ColorValue("#E3E1DF"))
            Color: =If(varTab = "all", Color.White, LineGrey)
            Height: =28
            OnSelect: =Set(varTab, "all")
            RadiusBottomLeft: =14
            RadiusBottomRight: =14
            RadiusTopLeft: =14
            RadiusTopRight: =14
            Size: =12
            Text: =CountRows(Filter(colRows, Lvl >= 2 && StatusText <> "Cancelled"))
            Width: =If(Parent.Width < 1200, 44, 56)
            X: =lblTabAll.X + lblTabAll.Width + 6
            Y: =120
      - recTabAllUnder:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =Navy
            Height: =4
            Visible: =varTab = "all"
            Width: =lblCountAll.X + lblCountAll.Width - lblTabAll.X
            X: =lblTabAll.X
            Y: =162
      - lblTabMine:
          Control: ModernText@1.0.0
          Properties:
            Color: =Navy
            FontWeight: =FontWeight.Semibold
            Height: =52
            OnSelect: =Set(varTab, "mine")
            Size: =If(Parent.Width < 1200, 16, 20)
            Text: ="My Items"
            Width: =If(Parent.Width < 1200, 96, 120)
            X: =lblCountAll.X + lblCountAll.Width + If(Parent.Width < 1200, 28, 64)
            Y: =108
      - lblCountMine:
          Control: ModernButton@1.0.0
          Properties:
            BasePaletteColor: =If(varTab = "mine", Navy, ColorValue("#E3E1DF"))
            Color: =If(varTab = "mine", Color.White, LineGrey)
            Height: =28
            OnSelect: =Set(varTab, "mine")
            RadiusBottomLeft: =14
            RadiusBottomRight: =14
            RadiusTopLeft: =14
            RadiusTopRight: =14
            Size: =12
            Text: |-
              =CountRows(Filter(colRows, Lvl >= 2 &&
                  (Lower(AssignedMail) = MyMail || MyMail in CollabMails)))
            Width: =If(Parent.Width < 1200, 44, 56)
            X: =lblTabMine.X + lblTabMine.Width + 6
            Y: =120
      - recTabMineUnder:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =Navy
            Height: =4
            Visible: =varTab = "mine"
            Width: =lblCountMine.X + lblCountMine.Width - lblTabMine.X
            X: =lblTabMine.X
            Y: =162
      - lblTabRoad:
          Control: ModernText@1.0.0
          Properties:
            Color: =Navy
            FontWeight: =FontWeight.Semibold
            Height: =52
            OnSelect: =Set(varTab, "roadmap")
            Size: =If(Parent.Width < 1200, 16, 20)
            Text: ="Roadmap"
            Width: =If(Parent.Width < 1200, 92, 112)
            X: =lblCountMine.X + lblCountMine.Width + If(Parent.Width < 1200, 28, 64)
            Y: =108
      - lblCountRoad:
          Control: ModernButton@1.0.0
          Properties:
            BasePaletteColor: =If(varTab = "roadmap", Navy, ColorValue("#E3E1DF"))
            Color: =If(varTab = "roadmap", Color.White, LineGrey)
            Height: =28
            OnSelect: =Set(varTab, "roadmap")
            RadiusBottomLeft: =14
            RadiusBottomRight: =14
            RadiusTopLeft: =14
            RadiusTopRight: =14
            Size: =12
            Text: =CountRows(Filter(colRows, Lvl >= 2 && Roadmap))
            Width: =If(Parent.Width < 1200, 44, 56)
            X: =lblTabRoad.X + lblTabRoad.Width + 6
            Y: =120
      - recTabRoadUnder:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =Navy
            Height: =4
            Visible: =varTab = "roadmap"
            Width: =lblCountRoad.X + lblCountRoad.Width - lblTabRoad.X
            X: =lblTabRoad.X
            Y: =162
      - lblTabAnalytics:
          Control: ModernText@1.0.0
          Properties:
            Color: =Navy
            FontWeight: =FontWeight.Semibold
            Height: =52
            OnSelect: =Set(varTab, "analytics")
            Size: =If(Parent.Width < 1200, 16, 20)
            Text: ="Analytics"
            Width: =If(Parent.Width < 1200, 88, 110)
            X: =lblCountRoad.X + lblCountRoad.Width + If(Parent.Width < 1200, 28, 64)
            Y: =108
      - recTabAnalyticsUnder:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =Navy
            Height: =4
            Visible: =varTab = "analytics"
            Width: =lblTabAnalytics.Width
            X: =lblTabAnalytics.X
            Y: =162
      - icoRefresh:
          Control: ModernButton@1.0.0
          Properties:
            AccessibleLabel: ="Reload work items"
            Appearance: =ButtonAppearance.Transparent
            Color: =Accent
            Height: =36
            Icon: ="ArrowClockwise"
            Layout: =ButtonLayout.IconOnly
            OnSelect: |-
              =ClearCollect(colItems,
                  AddColumns(
                      'BOB Integrated Master Schedule (IMS)',
                      SectionText,  Coalesce(ThisRecord.Section.Label, "Unassigned"),
                      LevelText,    ThisRecord.Level.Value,
                      StatusText,   Coalesce(ThisRecord.Status.Value, "Not Started")
                  ));
              ClearCollect(colRows,
                  ForAll(Distinct(colItems, SectionText) As s,
                      {
                          RowKey: "S|" & s.Value, SectionKey: "S|" & s.Value,
                          LOEKey: Blank(), EpicKey: Blank(),
                          Lvl: 1, RowTitle: s.Value, ItemId: Blank(),
                          StatusText: Blank(), AppraisalText: Blank(),
                          AssignedName: Blank(), AssignedMail: Blank(), CollabMails: Blank(),
                          RowStart: Blank(), RowDue: Blank(), Roadmap: false,
                          SortPath: s.Value
                      }));
              Collect(colRows,
                  ForAll(Filter(colItems, LevelText = "Line of Effort") As it,
                      {
                          RowKey: "L|" & it.SectionText & "|" & it.'Task Name',
                          SectionKey: "S|" & it.SectionText,
                          LOEKey: "L|" & it.SectionText & "|" & it.'Task Name', EpicKey: Blank(),
                          Lvl: 2, RowTitle: it.'Task Name', ItemId: it.ID,
                          StatusText: it.StatusText, AppraisalText: it.Appraisal.Value,
                          AssignedName: it.Assigned.DisplayName, AssignedMail: it.Assigned.Email,
                          CollabMails: Concat(it.Collaborators, Email, ";"),
                          RowStart: it.Start, RowDue: it.Due, Roadmap: it.'Roadmap Item',
                          SortPath: it.SectionText & "|" & it.'Task Name'
                      }));
              Collect(colRows,
                  ForAll(Filter(colItems, LevelText = "Epic") As it,
                      {
                          RowKey: "E|" & it.SectionText & "|" & it.'Line of Effort' & "|" & it.'Task Name',
                          SectionKey: "S|" & it.SectionText,
                          LOEKey: "L|" & it.SectionText & "|" & it.'Line of Effort',
                          EpicKey: "E|" & it.SectionText & "|" & it.'Line of Effort' & "|" & it.'Task Name',
                          Lvl: 3, RowTitle: it.'Task Name', ItemId: it.ID,
                          StatusText: it.StatusText, AppraisalText: it.Appraisal.Value,
                          AssignedName: it.Assigned.DisplayName, AssignedMail: it.Assigned.Email,
                          CollabMails: Concat(it.Collaborators, Email, ";"),
                          RowStart: it.Start, RowDue: it.Due, Roadmap: it.'Roadmap Item',
                          SortPath: it.SectionText & "|" & it.'Line of Effort' & "|" & it.'Task Name'
                      }));
              Collect(colRows,
                  ForAll(Filter(colItems, LevelText = "Task") As it,
                      {
                          RowKey: "T|" & it.ID,
                          SectionKey: "S|" & it.SectionText,
                          LOEKey: "L|" & it.SectionText & "|" & it.'Line of Effort',
                          EpicKey: "E|" & it.SectionText & "|" & it.'Line of Effort' & "|" & it.Epic,
                          Lvl: 4, RowTitle: it.'Task Name', ItemId: it.ID,
                          StatusText: it.StatusText, AppraisalText: it.Appraisal.Value,
                          AssignedName: it.Assigned.DisplayName, AssignedMail: it.Assigned.Email,
                          CollabMails: Concat(it.Collaborators, Email, ";"),
                          RowStart: it.Start, RowDue: it.Due, Roadmap: it.'Roadmap Item',
                          SortPath: it.SectionText & "|" & it.'Line of Effort' & "|" & it.Epic & "|" & it.'Task Name'
                      }))
            Tooltip: ="Reload work items"
            Visible: =varTab <> "analytics"
            Width: =36
            X: |
              =Max(lblTabAnalytics.X + lblTabAnalytics.Width + 20,
                   Parent.Width - If(Parent.Width < 1200, 292, 330))
            Y: =116
      - lblExport:
          Control: ModernButton@1.0.0
          Properties:
            Appearance: =ButtonAppearance.Transparent
            Color: =Accent
            DisplayMode: =If(Coalesce(varExporting, false), DisplayMode.Disabled, DisplayMode.Edit)
            Height: =40
            OnSelect: "=Set(varExporting, true);\r\n              Notify(\"Preparing your export…\", NotificationType.Information);\r\n              With({ fq:\r\n                  If(varTab = \"analytics\",\r\n                      Switch(Coalesce(varTile, \"total\"),\r\n                          \"loe\",   \"ItemLevel eq 'Line of Effort'\",\r\n                          \"epic\",  \"ItemLevel eq 'Epic'\",\r\n                          \"task\",  \"ItemLevel eq 'Task'\",\r\n                          \"risk\",  \"(ItemLevel eq 'Line of Effort' or ItemLevel eq 'Epic' or ItemLevel eq 'Task') and Status eq 'At Risk'\",\r\n                          \"delay\", \"(ItemLevel eq 'Line of Effort' or ItemLevel eq 'Epic' or ItemLevel eq 'Task') and Status eq 'Delayed'\",\r\n                          \"block\", \"(ItemLevel eq 'Line of Effort' or ItemLevel eq 'Epic' or ItemLevel eq 'Task') and Status eq 'Blocked'\",\r\n                          \"(ItemLevel eq 'Line of Effort' or ItemLevel eq 'Epic' or ItemLevel eq 'Task')\")\r\n                      & If(Coalesce(varQuarter, 0) > 0,\r\n                           \" and Due ge '\" & Text(varQStart, \"yyyy-mm-dd\") &\r\n                           \"' and Due lt '\" & Text(varQEnd, \"yyyy-mm-dd\") & \"'\",\r\n                           \"\"),\r\n                      \"(ItemLevel eq 'Line of Effort' or ItemLevel eq 'Epic' or ItemLevel eq 'Task')\"\r\n                      & If(!IsBlank(ddStatusFilter.Selected.Value)\r\n                           && ddStatusFilter.Selected.Value <> \"All Statuses\",\r\n                           \" and Status eq '\" & ddStatusFilter.Selected.Value & \"'\", \"\")\r\n                      & If(!IsBlank(ddApprFilter.Selected.Value)\r\n                           && ddApprFilter.Selected.Value <> \"All Appraisals\",\r\n                           \" and Appraisal eq '\" & ddApprFilter.Selected.Value & \"'\", \"\")\r\n                      & If(varTab = \"roadmap\", \" and RoadmapItem eq 1\", \"\")) },\r\n                  With({ result: 'BOBIMS-ExportToExcel'.Run(\r\n                              fq,\r\n                              If(varTab <> \"analytics\", Lower(Trim(txtSearch.Text)), \"\"),\r\n                              If(varTab = \"mine\", \r\n                                IfError(Coalesce(MyMail, Lower(User().Email)),\r\n                                    Lower(User().Email)),\r\n                              \"\"),\r\n                              Switch(varTab,\r\n                                  \"analytics\", \"Analytics-\" & Coalesce(varTile, \"total\") &\r\n                                      If(Coalesce(varQuarter, 0) > 0, \"-Q\" & varQuarter, \"\"),\r\n                                  \"mine\", \"MyItems\",\r\n                                  \"roadmap\", \"Roadmap\",\r\n                                  \"AllWork\")\r\n                              & \"-\" & Text(Now(), \"yyyymmdd-hhmmss\")) },\r\n                      If(result.rowcount = \"0\",\r\n                          Notify(\"Nothing to export in the current view.\",\r\n                                 NotificationType.Warning),\r\n                          !IsBlank(result.fileurl),\r\n                          Launch(result.fileurl),\r\n                          Notify(\"Export failed — try again or contact the admin.\",\r\n                                 NotificationType.Error))));\r\n              Set(varExporting, false)\r\n       "
            Size: =If(Parent.Width < 1200, 12, 13)
            Text: =If(Coalesce(varExporting, false), "Exporting…", "Export")
            Width: =If(Parent.Width < 1200, 72, 90)
            X: |-
              =//icoRefresh.X + icoRefresh.Width + 6
              icoRefresh.X + If(varTab = "analytics", 0, icoRefresh.Width + 6)
            Y: =114
      - lblNewItem:
          Control: ModernButton@1.0.0
          Properties:
            Appearance: =ButtonAppearance.Transparent
            Color: =Accent
            Height: =40
            OnSelect: |-
              =Set(varSelected, Blank());
              Set(varChain, Blank()); Set(varParent, Blank());
              Set(varErrors, Filter(Table({ Field: "", Bad: false }), Bad));
              Reset(pnLevel); Reset(pnSection); Reset(pnParent);
              Reset(pnTitle); Reset(pnDesc); Reset(pnAssigned); Reset(pnCollab);
              Reset(pnStatus); Reset(pnStart); Reset(pnDue);
              Set(varPanelMode, "new")
            Size: =If(Parent.Width < 1200, 12, 13)
            Text: ="+ New Item"
            Visible: =(varCanWrite || varCanWriteET) && varTab <> "analytics"
            Width: =If(Parent.Width < 1200, 116, 140)
            X: =lblExport.X + lblExport.Width + 6
            Y: =114
      - recTabBarLine:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =LineGrey
            Height: =1
            Width: =Parent.Width
            Y: =166
      - txtSearch:
