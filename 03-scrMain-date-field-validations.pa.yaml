      - prBtnConfirmDelete:
          Control: ModernButton@1.0.0
          Properties:
            BasePaletteColor: =ColorValue("#C0392B")
            Color: =Color.White
            DisplayMode: =If(varTab <> "analytics", DisplayMode.Edit, DisplayMode.Disabled)
            Height: =44
            OnSelect: |-
              =With({ kids: CountRows(Filter('BOB Integrated Master Schedule (IMS)', 'Parent'.Id = varSelected.ID)) },
                  If(kids > 0,
                      Notify("Cannot delete " & varSelected.Level.Value & " """ & varSelected.'Task Name' & """ — it has " &
                             kids & " child item(s). Reassign or delete the children first.",
                             NotificationType.Error);
                      Set(varConfirmDeleteId, Blank()),
                      With({ lvl: varSelected.Level.Value, nm: varSelected.'Task Name' },
                          Remove('BOB Integrated Master Schedule (IMS)', varSelected);
                          RemoveIf(colItems, ID = varSelected.ID);
                          RemoveIf(colRows, ItemId = varSelected.ID);
                          Set(varConfirmDeleteId, Blank());
                          Set(varPanelMode, "");
                          Notify(lvl & " """ & nm & """ was deleted — recoverable from the Recycle Bin for 93 days.",
                                 NotificationType.Success, 4000))))
            Size: =14
            Text: ="Confirm"
            Visible: =varPanelMode = "read" && varIsAdmin && varConfirmDeleteId = varSelected.ID
            Width: =(Parent.Width / 2 - 52 - 12) / 2
            X: =Parent.Width / 2 + 26
            Y: =Parent.Height - 62
